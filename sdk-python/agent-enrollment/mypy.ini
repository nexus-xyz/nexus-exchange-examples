# CI runs `mypy .` from this directory, so this file is the whole configuration.
[mypy]
# Targets the version CI installs, not whatever the local interpreter happens to
# be — a check that passes on 3.14 and fails on 3.12 is not a gate.
python_version = 3.12

# The point of typechecking an example is that the example is read as a model of
# how to write one. Strict, therefore, rather than strict-ish.
strict = True
warn_unreachable = True
warn_unused_configs = True
warn_unused_ignores = True

# `nexus-exchange` 0.4.0 is fully annotated but ships no `py.typed` marker, so
# under PEP 561 a type checker ignores all of it. Without this line `mypy .`
# reports one `import-untyped` error and then types every SDK value as `Any` —
# so `strict = True` would pass while verifying nothing at the one boundary that
# matters, which is worse than not checking at all. This makes mypy read the
# SDK's real annotations instead.
#
# Remove it once the SDK ships `py.typed`; `warn_unused_configs` above is what
# will notice.
follow_untyped_imports = True
