# CI runs `mypy .` from this directory, so this file is the whole configuration.
[mypy]
# Targets the version CI installs, not whatever the local interpreter happens to
# be — a check that passes on 3.14 and fails on 3.12 is not a gate.
python_version = 3.12

# The point of typechecking an example is that the example is read as a model of
# how to write one. Strict, therefore, rather than strict-ish.
strict = True
warn_unreachable = True
warn_unused_configs = True
warn_unused_ignores = True
disallow_any_explicit = False

# `Any` is unavoidable at the JSON boundary: `json.loads` returns it, and every
# validator in `series.py` exists precisely to turn that into something typed.
# Explicit `Any` is allowed there (above) and nowhere is it implicit.
